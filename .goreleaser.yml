version: 2

project_name: vminfo

before:
  hooks:
    - go mod tidy

builds:
  - id: vminfo
    main: ./cmd/vminfo
    binary: vminfo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/VPSMarket/vminfo.Version={{.Version}}
      - -X github.com/VPSMarket/vminfo.Commit={{.Commit}}
      - -X github.com/VPSMarket/vminfo.BuildTime={{.Date}}
      - -X github.com/VPSMarket/vminfo.Channel=stable
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}-
      {{- .Version }}-
      {{- .Os }}-
      {{- .Arch }}
    formats: tar.gz
    format_overrides:
      - goos: windows
        formats: zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: VPSMarket
    name: vminfo
  draft: false
  prerelease: auto
  mode: replace

nfpms:
  - id: packages
    package_name: vminfo
    maintainer: VPSMarket
    description: Host runtime information toolkit
    homepage: https://github.com/VPSMarket/vminfo
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/vminfo/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/vminfo/README.md
