version: 2

project_name: vminfo

builds:
  - id: vminfo
    main: ./cmd/vminfo
    binary: vminfo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/cloudapp3/vminfo.Version={{.Version}}
      - -X github.com/cloudapp3/vminfo.Commit={{.Commit}}
      - -X github.com/cloudapp3/vminfo.BuildTime={{.Date}}
      - -X github.com/cloudapp3/vminfo.Channel=stable
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}-
      {{- .Version }}-
      {{- .Os }}-
      {{- .Arch }}
    formats: tar.gz
    format_overrides:
      - goos: windows
        formats: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: cloudapp3
    name: vminfo
  draft: false
  prerelease: auto
  mode: replace
  header: |
    {{ .ProjectName }} {{ .Tag }} is a cross-platform terminal system monitor with JSON output, a web dashboard, a read-only local MCP server, network diagnostics, and embeddable Go APIs.

    ## Changes
  footer: |
    ## Install or upgrade

    Linux and macOS:

    ```bash
    curl -fsSL https://raw.githubusercontent.com/cloudapp3/vminfo/main/install.sh | sudo bash -s -- --dir /usr/local/bin
    ```

    Existing Linux and macOS release builds can upgrade with:

    ```bash
    vminfo update --version {{ .Tag }}
    ```

    Download archives and Linux packages from the assets below. Verify downloads against `checksums.txt` before installation.

    [Documentation](https://vminfo.bestcheapvps.org) · [MCP setup](https://vminfo.bestcheapvps.org/commands/mcp) · [Quick start](https://vminfo.bestcheapvps.org/guide/quick-start) · [Command reference](https://vminfo.bestcheapvps.org/commands/) · [Compare releases](https://github.com/cloudapp3/vminfo/releases)

nfpms:
  - id: packages
    package_name: vminfo
    maintainer: cloudapp3
    description: Terminal system monitor with JSON, web dashboard, and read-only MCP tools
    homepage: https://vminfo.bestcheapvps.org
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/vminfo/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/vminfo/README.md
